name: PR Preview

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rust-conveyor-filters
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  PREVIEW_HOST: pr-${{ github.event.pull_request.number }}-dev.rustconveyorfilters.com

jobs:
  deploy:
    name: Build & deploy preview
    # Fork and Dependabot PRs can't read Actions secrets, so they can't reach Dokploy.
    if: >
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    environment:
      name: preview
      url: https://${{ env.PREVIEW_HOST }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PREVIEW_NAME }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_DEV_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_RYBBIT_HOST=${{ vars.NEXT_PUBLIC_RYBBIT_HOST }}
            NEXT_PUBLIC_COMMIT_SHA=${{ github.event.pull_request.head.sha }}
          secrets: |
            STEAM_API_KEY=${{ secrets.STEAM_API_KEY }}
            STEAM_ID=${{ secrets.STEAM_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        run: >
          .github/scripts/dokploy.sh preview_up
          "${{ vars.DOKPLOY_STAGING_ENV_ID }}"
          "${{ vars.DOKPLOY_DEV_APP_ID }}"
          "$PREVIEW_NAME"
          "$REGISTRY/$IMAGE_NAME:$PREVIEW_NAME"
          "$PREVIEW_HOST"
        env:
          DOKPLOY_URL: ${{ secrets.DEPLOY_API_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DEPLOY_API_TOKEN }}

  teardown:
    name: Remove preview
    if: >
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Delete preview app
        run: .github/scripts/dokploy.sh preview_down "${{ vars.DOKPLOY_STAGING_ENV_ID }}" "$PREVIEW_NAME"
        env:
          DOKPLOY_URL: ${{ secrets.DEPLOY_API_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DEPLOY_API_TOKEN }}
