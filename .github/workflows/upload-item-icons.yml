name: Upload item icons

on:
  push:
    branches:
      - main
    # The uploader diffs against the bucket, so its own first merge also
    # catches up on icons committed before it existed.
    paths:
      - public/items/**
      - src/scripts/items/bucket.ts
      - src/scripts/items/upload-icons.ts
      - .github/workflows/upload-item-icons.yml
  workflow_dispatch:

concurrency:
  group: upload-item-icons
  cancel-in-progress: false

jobs:
  upload:
    name: Upload changed icons to R2
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun ci

      - run: bun items:upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
