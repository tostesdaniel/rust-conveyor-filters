name: CI

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check & test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun ci

      - run: bun run lint

      - run: bunx next typegen

      - run: bun run type-check

      - name: Check migrations match the schema
        run: |
          bunx drizzle-kit generate
          if [ -n "$(git status --porcelain src/db/migrations)" ]; then
            echo "::error::src/db/schema.ts changed without a migration. Run 'bun db:generate' and commit the result."
            git status --porcelain src/db/migrations
            exit 1
          fi

      - run: bun run test
