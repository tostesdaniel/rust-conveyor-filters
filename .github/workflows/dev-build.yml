name: Dev Deploy

on:
  push:
    branches:
      - dev

concurrency:
  group: dev-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rust-conveyor-filters

jobs:
  build-and-deploy:
    name: Build & deploy dev
    runs-on: ubuntu-24.04
    environment:
      name: dev
      url: https://dev.rustconveyorfilters.com
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_DEV_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_RYBBIT_HOST=${{ vars.NEXT_PUBLIC_RYBBIT_HOST }}
            NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
          secrets: |
            STEAM_API_KEY=${{ secrets.STEAM_API_KEY }}
            STEAM_ID=${{ secrets.STEAM_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        run: .github/scripts/dokploy.sh deploy "${{ vars.DOKPLOY_DEV_APP_ID }}"
        env:
          DOKPLOY_URL: ${{ secrets.DEPLOY_API_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DEPLOY_API_TOKEN }}
          DEPLOY_TITLE: "Dev ${{ github.sha }}"
